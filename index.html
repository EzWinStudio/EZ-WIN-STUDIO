<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EZWIN STUDIO | Official</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* GENEL TASARIM */
        :root {
            --bg: #050505;
            --accent: #ffffff;
            --glass: rgba(255, 255, 255, 0.05);
            --gradient: linear-gradient(90deg, #fff, #666, #fff);
            --cyan: #00d5ff;
            --panel-bg: rgba(10, 15, 20, 0.9);
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: var(--bg); color: white;
            font-family: 'Inter', sans-serif; overflow: hidden;
            user-select: none;
        }

        #bg-canvas {
            position: fixed; top: 0; left: 0; 
            width: 100%; height: 100%;
            z-index: 1; opacity: 0.3; pointer-events: none;
        }

        .animated-text {
            background: var(--gradient);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 3s linear infinite;
            font-weight: 900;
            text-transform: uppercase;
        }

        @keyframes shine { to { background-position: 200% center; } }

        .main-content {
            position: relative; z-index: 10;
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; height: 100vh; text-align: center;
        }

        .header h1 { font-size: 4rem; margin: 0; letter-spacing: -2px; }
        .sub-header { font-size: 10px; letter-spacing: 4px; opacity: 0.4; margin-bottom: 40px; }

        .links-grid {
            display: grid; grid-template-columns: repeat(3, 1fr);
            gap: 15px; width: 90%; max-width: 850px;
        }

        .btn {
            background: var(--glass);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 22px; border-radius: 10px;
            color: white; text-decoration: none;
            font-weight: bold; font-size: 13px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            backdrop-filter: blur(5px);
            display: flex; align-items: center; justify-content: center;
        }

        .btn:hover {
            background: white; color: black;
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(255,255,255,0.4);
        }

        .btn.dark { background: rgba(0,0,0,0.8); }
        .btn.full { grid-column: span 3; border: 2px solid white; margin-top: 10px; }

        .footer-text {
            position: fixed; bottom: 20px; right: 30px;
            font-size: 11px; letter-spacing: 2px; z-index: 100;
        }

        /* YOUTUBE OYNATICI */
        #yt-player-container { position: absolute; left: -9999px; opacity: 0; }

        /* MÜZİK ÇALAR ARAYÜZÜ */
        .music-widget {
            position: fixed; top: 30px; left: 30px; z-index: 100;
            display: flex; flex-direction: column; gap: 15px;
        }

        .music-toggle {
            width: 50px; height: 50px;
            border: 1px solid var(--cyan); border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            background: var(--panel-bg); color: var(--cyan);
            cursor: pointer; font-size: 20px; transition: 0.3s;
            backdrop-filter: blur(10px);
        }

        .music-panel {
            width: 280px; background: var(--panel-bg);
            border: 1px solid var(--cyan); border-radius: 16px;
            padding: 20px; backdrop-filter: blur(15px);
            opacity: 0; transform: translateY(-20px) scale(0.95);
            pointer-events: none; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .music-panel.active { opacity: 1; transform: translateY(0) scale(1); pointer-events: all; }

        .music-controls {
            display: flex; justify-content: center; align-items: center;
            gap: 30px; color: var(--cyan); font-size: 20px;
            padding-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 15px;
        }

        .music-controls i { cursor: pointer; transition: 0.2s; }
        .music-controls i:hover { transform: scale(1.2); text-shadow: 0 0 10px var(--cyan); }

        .track-item {
            display: flex; align-items: center; gap: 12px;
            padding: 10px; border-radius: 12px; cursor: pointer;
            transition: 0.3s; border: 1px solid transparent;
        }

        .track-item.playing { border-color: var(--cyan); background: rgba(0, 213, 255, 0.1); }
        .track-item img { width: 45px; height: 45px; border-radius: 8px; object-fit: cover; }
        .track-title { font-size: 13px; font-weight: bold; color: white; }

        /* SES PANELİ (VOLUME HUD) - GÖRSELDEKİ GİBİ */
        .volume-hud {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid var(--cyan);
            border-radius: 20px;
            padding: 25px;
            display: flex; flex-direction: column; align-items: center;
            justify-content: center;
            z-index: 1000;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
            min-width: 140px;
        }

        .volume-hud i { font-size: 50px; color: var(--cyan); margin-bottom: 15px; }
        .volume-hud span { 
            font-size: 18px; font-weight: bold; 
            letter-spacing: 2px; color: white;
        }

        .volume-hud.show { opacity: 1; }

        input[type="range"] { flex: 1; accent-color: var(--cyan); cursor: pointer; }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <div class="volume-hud" id="volumeHud">
        <i class="fas fa-volume-up" id="hudIcon"></i>
        <span id="hudText">SES: %50</span>
    </div>

    <div class="music-widget">
        <div class="music-toggle" id="musicToggle"><i class="fas fa-bars"></i></div>
        
        <div class="music-panel" id="musicPanel">
            <div class="music-controls">
                <i class="fas fa-step-backward" id="prev"></i>
                <i class="fas fa-play" id="playBtn"></i>
                <i class="fas fa-step-forward" id="next"></i>
            </div>
            <div class="music-list" id="musicList"></div>
            <div style="display:flex; align-items:center; gap:10px; margin-top:15px; opacity:0.6">
                <i class="fas fa-volume-down" id="muteToggle" style="cursor:pointer"></i>
                <input type="range" id="volume" min="0" max="100" value="50">
            </div>
        </div>
    </div>

    <div class="main-content">
        <div class="header"><h1 class="animated-text">EZWIN STUDIO</h1></div>
        <p class="sub-header">FOUNDER: EZWIN YASEN</p>
        <div class="links-grid">
            <a href="#" class="btn">JOIN THE EZWIN MUSIC</a>
            <a href="#" class="btn dark"><i class="fab fa-youtube" style="color:red; margin-right:10px"></i> EZWIN STUDIO</a>
            <a href="#" class="btn">EZWIN UNCOPYLOCKED</a>
            <a href="#" class="btn">EZWIN HESAP HİZMETLERİ</a>
            <a href="#" class="btn dark"><i class="fab fa-youtube" style="color:red; margin-right:10px"></i> EZWIN MUSIC</a>
            <a href="#" class="btn">JOIN THE EZWIN CHEAT</a>
            <a href="#" class="btn full">JOIN THE EZWIN STUDIO</a>
        </div>
    </div>

    <div class="footer-text animated-text">POWERED BY: EZWINSTUDIO</div>
    <div id="yt-player-container"><div id="yt-player"></div></div>

    <script>
        // ARKA PLAN
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        const words = ['EZWIN', 'NIM', 'STUDIO', '404', 'WIN', 'SAS', 'ROOT', '{}', '***', '666', 'EZ'];
        let particles = [];
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.onresize = resize; resize();

        class Particle {
            constructor() { this.init(); this.y = Math.random() * canvas.height; }
            init() {
                this.x = Math.random() * canvas.width; this.y = canvas.height + 50;
                this.speed = 0.5 + Math.random() * 1.5;
                this.text = words[Math.floor(Math.random() * words.length)];
                this.fontSize = 12 + Math.random() * 15;
                this.opacity = 0.1 + Math.random() * 0.3;
                this.rot = Math.random() * 6; this.rotSpeed = (Math.random() - 0.5) * 0.02;
            }
            draw() {
                ctx.save(); ctx.globalAlpha = this.opacity; ctx.fillStyle = "white";
                ctx.font = `bold ${this.fontSize}px Arial`;
                ctx.translate(this.x, this.y); ctx.rotate(this.rot);
                ctx.fillText(this.text, 0, 0); ctx.restore();
                this.y -= this.speed; this.rot += this.rotSpeed;
                if (this.y < -50) this.init();
            }
        }
        for(let i=0; i<60; i++) particles.push(new Particle());
        function animate() { ctx.clearRect(0,0, canvas.width, canvas.height); particles.forEach(p => p.draw()); requestAnimationFrame(animate); }
        animate();

        // MÜZİK SİSTEMİ
        const playlistData = [
            { id: '_9bw_VtMUGA', title: 'New Person', img: 'https://img.youtube.com/vi/_9bw_VtMUGA/mqdefault.jpg' },
            { id: 'KhqNTjbQ71A', title: 'Last Christmas', img: 'https://img.youtube.com/vi/KhqNTjbQ71A/mqdefault.jpg' }
        ];

        let currentTrack = 0, player, isPlaying = false, hudTimer;

        const musicToggle = document.getElementById('musicToggle');
        const musicPanel = document.getElementById('musicPanel');
        const volumeHud = document.getElementById('volumeHud');
        const hudText = document.getElementById('hudText');
        const hudIcon = document.getElementById('hudIcon');

        musicToggle.onclick = () => musicPanel.classList.toggle('active');

        // Ses Paneli Gösterme Fonksiyonu
        function showHud(text, iconClass) {
            clearTimeout(hudTimer);
            hudText.innerText = text;
            hudIcon.className = `fas ${iconClass}`;
            volumeHud.classList.add('show');
            hudTimer = setTimeout(() => volumeHud.classList.remove('show'), 1500);
        }

        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        document.head.appendChild(tag);

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('yt-player', {
                height: '0', width: '0',
                videoId: playlistData[currentTrack].id,
                playerVars: { 'autoplay': 0, 'controls': 0 },
                events: { 'onReady': onPlayerReady, 'onStateChange': (e) => { if(e.data === 0) document.getElementById('next').click(); } }
            });
        }

        function renderPlaylist() {
            const list = document.getElementById('musicList');
            list.innerHTML = playlistData.map((t, i) => `
                <div class="track-item ${i === currentTrack ? 'playing' : ''}" onclick="playTrack(${i})">
                    <img src="${t.img}">
                    <span class="track-title">${t.title}</span>
                </div>
            `).join('');
        }

        function playTrack(i) {
            currentTrack = i;
            player.loadVideoById(playlistData[i].id);
            isPlaying = true;
            document.getElementById('playBtn').className = "fas fa-pause";
            renderPlaylist();
        }

        function onPlayerReady() {
            renderPlaylist();
            const playBtn = document.getElementById('playBtn');
            const volSlider = document.getElementById('volume');
            const muteBtn = document.getElementById('muteToggle');

            playBtn.onclick = () => {
                if(isPlaying) { player.pauseVideo(); playBtn.className = "fas fa-play"; }
                else { player.playVideo(); playBtn.className = "fas fa-pause"; }
                isPlaying = !isPlaying;
            };

            document.getElementById('next').onclick = () => playTrack((currentTrack + 1) % playlistData.length);
            document.getElementById('prev').onclick = () => playTrack((currentTrack - 1 + playlistData.length) % playlistData.length);

            volSlider.oninput = (e) => {
                const val = e.target.value;
                player.setVolume(val);
                showHud(`SES: %${val}`, val == 0 ? 'fa-volume-mute' : 'fa-volume-up');
            };

            muteBtn.onclick = () => {
                if(player.isMuted()) {
                    player.unMute();
                    muteBtn.className = "fas fa-volume-down";
                    showHud("SES AÇILDI", "fa-volume-up");
                } else {
                    player.mute();
                    muteBtn.className = "fas fa-volume-mute";
                    showHud("SES KAPATILDI", "fa-volume-mute");
                }
            };
        }
    </script>
</body>
</html>
