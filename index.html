<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EZWIN STUDIO | Premium Official</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* --- YENİ DİNAMİK RENK PALETİ --- */
        :root {
            --bg: #030305;
            --accent-primary: #007cf0;  /* Safir Mavi */
            --accent-secondary: #00dfd8; /* Turkuaz */
            --accent-pink: #ff0080;     /* Elektrik Pembe */
            --accent-glow: rgba(0, 124, 240, 0.4);
            --glass: rgba(255, 255, 255, 0.03);
            --panel-bg: rgba(5, 5, 10, 0.9);
            --text-gradient: linear-gradient(to right, #007cf0, #00dfd8, #ff0080);
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: var(--bg); color: white;
            font-family: 'Inter', sans-serif; overflow: hidden;
            user-select: none;
        }

        #bg-canvas {
            position: fixed; top: 0; left: 0; 
            width: 100%; height: 100%;
            z-index: 1; opacity: 0.3; pointer-events: none;
        }

        /* --- BAŞLIK VE ANİMASYONLAR --- */
        .animated-text {
            background: var(--text-gradient);
            background-size: 300% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: flow 5s linear infinite;
            font-weight: 900;
            text-transform: uppercase;
        }

        @keyframes flow {
            0% { background-position: 0% center; }
            50% { background-position: 100% center; }
            100% { background-position: 0% center; }
        }

        .main-content {
            position: relative; z-index: 10;
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; height: 100vh; text-align: center;
        }

        .header h1 { 
            font-size: 5rem; margin: 0; letter-spacing: -4px; 
            filter: drop-shadow(0 0 20px rgba(0, 124, 240, 0.6));
        }

        .sub-header { 
            font-size: 12px; letter-spacing: 6px; opacity: 0.7; 
            margin-bottom: 50px; color: var(--accent-secondary);
        }

        /* --- ÇEKİCİ BUTON TASARIMI --- */
        .links-grid {
            display: grid; grid-template-columns: repeat(3, 1fr);
            gap: 20px; width: 90%; max-width: 900px;
        }

        .btn {
            position: relative;
            background: var(--glass);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 24px; border-radius: 15px;
            color: white; text-decoration: none;
            font-weight: bold; font-size: 14px;
            text-transform: uppercase; letter-spacing: 1px;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            backdrop-filter: blur(15px);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 8px;
        }

        /* Buton İçindeki Parlama Efekti (Shimmer) */
        .btn::before {
            content: ''; position: absolute; top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            opacity: 0; transition: 0.5s;
        }

        .btn:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: var(--accent-primary);
            box-shadow: 0 20px 40px rgba(0, 124, 240, 0.3);
            background: rgba(255, 255, 255, 0.05);
        }

        .btn:hover::before { opacity: 1; }

        .btn i { font-size: 20px; transition: 0.3s; }
        .btn:hover i { transform: scale(1.2); color: var(--accent-secondary); }

        /* Özel Renkli Butonlar */
        .btn.youtube:hover { 
            border-color: var(--accent-pink); 
            box-shadow: 0 15px 30px rgba(255, 0, 128, 0.4); 
        }
        .btn.full { 
            grid-column: span 3; 
            background: linear-gradient(45deg, rgba(0, 124, 240, 0.1), rgba(255, 0, 128, 0.1));
            border-width: 2px;
            margin-top: 10px;
        }

        /* --- MÜZİK ÇALAR --- */
        .music-widget {
            position: fixed; top: 30px; left: 30px; z-index: 100;
        }

        .music-toggle {
            width: 60px; height: 60px;
            border: 2px solid var(--accent-primary); border-radius: 20px;
            display: flex; align-items: center; justify-content: center;
            background: var(--panel-bg); color: var(--accent-primary);
            cursor: pointer; font-size: 24px; transition: 0.3s;
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .music-panel {
            position: absolute; top: 75px; left: 0;
            width: 320px; background: var(--panel-bg);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 25px;
            padding: 25px; backdrop-filter: blur(25px);
            opacity: 0; transform: translateX(-30px);
            pointer-events: none; transition: all 0.5s cubic-bezier(0.19, 1, 0.22, 1);
        }

        .music-panel.active { opacity: 1; transform: translateX(0); pointer-events: all; }

        .track-item {
            display: flex; align-items: center; gap: 15px;
            padding: 12px; border-radius: 15px; cursor: pointer;
            transition: 0.3s; border: 1px solid transparent; margin-bottom: 8px;
        }

        .track-item.playing { 
            border-color: var(--accent-primary); 
            background: rgba(0, 124, 240, 0.1);
        }

        /* --- HUD SİSTEMİ --- */
        .hud-panel {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0.7);
            background: rgba(5, 5, 10, 0.95);
            border: 2px solid var(--accent-secondary);
            border-radius: 30px; padding: 40px 60px;
            display: flex; flex-direction: column; align-items: center;
            z-index: 1000; pointer-events: none; opacity: 0;
            transition: all 0.5s cubic-bezier(0.19, 1, 0.22, 1);
            box-shadow: 0 0 60px rgba(0, 223, 216, 0.2);
        }

        .hud-panel.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        .hud-panel i { font-size: 60px; color: var(--accent-secondary); margin-bottom: 20px; }
        .hud-panel span { font-size: 22px; font-weight: 800; letter-spacing: 4px; }

        input[type="range"] { accent-color: var(--accent-primary); }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <div class="hud-panel" id="volumeHud">
        <i class="fas fa-volume-high" id="hudIcon"></i>
        <span id="hudText">SES: %50</span>
    </div>

    <div class="hud-panel" id="songHud">
        <i class="fas fa-compact-disc fa-spin"></i>
        <span id="songHudText" style="color: var(--accent-secondary);">OYNATILIYOR</span>
    </div>

    <div class="music-widget">
        <div class="music-toggle" id="musicToggle"><i class="fas fa-compact-disc"></i></div>
        <div class="music-panel" id="musicPanel">
            <div style="display:flex; justify-content: space-around; font-size: 25px; color: var(--accent-primary); margin-bottom: 20px;">
                <i class="fas fa-backward-step" id="prev" style="cursor:pointer"></i>
                <i class="fas fa-play" id="playBtn" style="cursor:pointer"></i>
                <i class="fas fa-forward-step" id="next" style="cursor:pointer"></i>
            </div>
            <div class="music-list" id="musicList"></div>
            <div style="display:flex; align-items:center; gap:10px; margin-top:20px;">
                <i class="fas fa-volume-low" style="color:var(--accent-primary)"></i>
                <input type="range" id="volume" min="0" max="100" value="50" style="width:100%">
            </div>
        </div>
    </div>

    <div class="main-content">
        <div class="header"><h1 class="animated-text">EZWIN STUDIO</h1></div>
        <p class="sub-header">ESTABLISHED BY EZWIN YASEN</p>
        
        <div class="links-grid">
            <a href="#" class="btn">
                <i class="fas fa-music"></i>
                <span>JOIN EZWIN MUSIC</span>
            </a>
            <a href="#" class="btn youtube">
                <i class="fab fa-youtube"></i>
                <span>EZWIN STUDIO</span>
            </a>
            <a href="#" class="btn">
                <i class="fas fa-unlock-alt"></i>
                <span>UNCOPYLOCKED</span>
            </a>
            <a href="#" class="btn">
                <i class="fas fa-user-shield"></i>
                <span>HESAP HİZMETLERİ</span>
            </a>
            <a href="#" class="btn youtube">
                <i class="fab fa-youtube"></i>
                <span>EZWIN MUSIC</span>
            </a>
            <a href="#" class="btn">
                <i class="fas fa-ghost"></i>
                <span>EZWIN CHEATS</span>
            </a>
            <a href="#" class="btn full">
                <i class="fas fa-rocket"></i>
                <span>ENTER THE EZWIN ECOSYSTEM</span>
            </a>
        </div>
    </div>

    <div class="footer-text animated-text" style="position:fixed; bottom:20px; right:30px; font-size:12px; letter-spacing:2px">EZWIN © 2024</div>
    
    <div id="yt-player-container"><div id="yt-player"></div></div>

    <script>
        // --- ARKA PLAN SİSTEMİ (Yeni Renklerle) ---
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        const words = ['EZWIN', 'SYSTEM', 'STUDIO', 'CODE', 'WIN', 'ROOT', 'VIP'];
        let particles = [];
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.onresize = resize; resize();

        class Particle {
            constructor() { this.init(); this.y = Math.random() * canvas.height; }
            init() {
                this.x = Math.random() * canvas.width; this.y = canvas.height + 50;
                this.speed = 0.5 + Math.random() * 1.5;
                this.text = words[Math.floor(Math.random() * words.length)];
                this.fontSize = 12 + Math.random() * 15;
                this.opacity = 0.1 + Math.random() * 0.2;
                this.color = Math.random() > 0.5 ? '#007cf0' : '#ff0080';
            }
            draw() {
                ctx.save(); ctx.globalAlpha = this.opacity; ctx.fillStyle = this.color;
                ctx.font = `bold ${this.fontSize}px Arial`;
                ctx.fillText(this.text, this.x, this.y); ctx.restore();
                this.y -= this.speed;
                if (this.y < -50) this.init();
            }
        }
        for(let i=0; i<40; i++) particles.push(new Particle());
        function animate() { ctx.clearRect(0,0, canvas.width, canvas.height); particles.forEach(p => p.draw()); requestAnimationFrame(animate); }
        animate();

        // --- MÜZİK VE HUD KONTROLLERİ ---
        const playlistData = [
            { id: '_9bw_VtMUGA', title: 'MILIARDARA' },
            { id: 'KhqNTjbQ71A', title: 'AKŞAMLAR' },
            { id: '3vAnU_Y0zE8', title: 'HONEY' }
        ];

        let currentTrack = 0, player, isPlaying = false, hudTimer, songTimer;

        const musicToggle = document.getElementById('musicToggle');
        const musicPanel = document.getElementById('musicPanel');
        musicToggle.onclick = () => musicPanel.classList.toggle('active');

        function showVolumeHud(text, iconClass) {
            clearTimeout(hudTimer);
            document.getElementById('hudText').innerText = text;
            document.getElementById('hudIcon').className = `fas ${iconClass}`;
            document.getElementById('volumeHud').classList.add('show');
            hudTimer = setTimeout(() => document.getElementById('volumeHud').classList.remove('show'), 1200);
        }

        function showSongHud(title) {
            clearTimeout(songTimer);
            document.getElementById('songHudText').innerText = title;
            document.getElementById('songHud').classList.add('show');
            songTimer = setTimeout(() => document.getElementById('songHud').classList.remove('show'), 2000);
        }

        // YouTube Player Entegrasyonu
        var tag = document.createElement('script'); tag.src = "https://www.youtube.com/iframe_api"; document.head.appendChild(tag);

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('yt-player', {
                height: '0', width: '0', videoId: playlistData[0].id,
                events: { 'onReady': onPlayerReady, 'onStateChange': (e) => { if(e.data === 0) document.getElementById('next').click(); } }
            });
        }

        function renderPlaylist() {
            const list = document.getElementById('musicList');
            list.innerHTML = playlistData.map((t, i) => `
                <div class="track-item ${i === currentTrack ? 'playing' : ''}" onclick="playTrack(${i})">
                    <span style="font-weight:bold; color:var(--accent-primary)">0${i+1}</span>
                    <span style="font-size:13px">${t.title}</span>
                </div>
            `).join('');
        }

        function playTrack(i) {
            currentTrack = i;
            player.loadVideoById(playlistData[i].id);
            isPlaying = true;
            document.getElementById('playBtn').className = "fas fa-pause";
            renderPlaylist();
            showSongHud(playlistData[i].title);
        }

        function onPlayerReady() {
            renderPlaylist();
            document.getElementById('playBtn').onclick = () => {
                if(isPlaying) { player.pauseVideo(); document.getElementById('playBtn').className = "fas fa-play"; }
                else { player.playVideo(); document.getElementById('playBtn').className = "fas fa-pause"; showSongHud(playlistData[currentTrack].title); }
                isPlaying = !isPlaying;
            };
            document.getElementById('next').onclick = () => playTrack((currentTrack + 1) % playlistData.length);
            document.getElementById('prev').onclick = () => playTrack((currentTrack - 1 + playlistData.length) % playlistData.length);
            document.getElementById('volume').oninput = (e) => {
                player.setVolume(e.target.value);
                showVolumeHud(`SES: %${e.target.value}`, "fa-volume-high");
            };
        }
    </script>
</body>
</html>
