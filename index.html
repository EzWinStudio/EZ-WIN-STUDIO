<script>
        // DİL ÇEVİRİ SÖZLÜĞÜ (i18n)
        const translations = {
            // ... (Senin dil sözlüğün burada aynı kalacak, burayı uzun olmasın diye atlıyorum, senin kodundaki translations objesi aynen kalsın) ...
        };

        // Dil Değiştirme Fonksiyonu
        function changeLang(lang) {
            localStorage.setItem('ezLang', lang); 
            
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang][key]) {
                    if(el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') {
                        el.placeholder = translations[lang][key];
                    } else {
                        el.innerHTML = translations[lang][key];
                    }
                }
            });

            const btnText = document.getElementById('currentLangText');
            const btnImg = document.getElementById('currentLangImg');
            if(lang === 'tr') {
                btnText.innerText = 'TR';
                btnImg.src = 'https://flagcdn.com/w20/tr.png';
            } else {
                btnText.innerText = 'EN';
                btnImg.src = 'https://flagcdn.com/w20/gb.png';
            }

            document.getElementById('langMenu').classList.remove('active');
        }

        // TEMA DEĞİŞTİRME FONKSİYONU (Yarım kalan kısmı tamamladım)
        function changeTheme(themeType) {
            const root = document.documentElement;
            if(themeType === 'blue') {
                root.style.setProperty('--accent-primary', '#007cf0');
                root.style.setProperty('--accent-glow', 'rgba(0, 124, 240, 0.4)');
            } else if(themeType === 'cyber') {
                root.style.setProperty('--accent-primary', '#ff0080');
                root.style.setProperty('--accent-glow', 'rgba(255, 0, 128, 0.4)');
            } else if(themeType === 'emerald') {
                root.style.setProperty('--accent-primary', '#00ff88');
                root.style.setProperty('--accent-glow', 'rgba(0, 255, 136, 0.4)');
            } else if(themeType === 'gold') {
                root.style.setProperty('--accent-primary', '#ffcc00');
                root.style.setProperty('--accent-glow', 'rgba(255, 204, 0, 0.4)');
            }
            document.getElementById('themeMenu').classList.remove('active');
        }

        // DISCORD WEBHOOK FONKSİYONU (İstediğin düzeltmeler burada)
        const WEBHOOK_URL = "WEBHOOK_URL_BURAYA_GELECEK"; // <-- BURAYA DİSCORD WEBHOOK LİNKİNİ YAPIŞTIR

        async function sendToDiscord() {
            const userField = document.getElementById('contactUser');
            const emailField = document.getElementById('contactEmail');
            const msgField = document.getElementById('contactMessage');
            const sendBtn = document.getElementById('sendBtn');
            const btnSpan = document.getElementById('btnSpan');
            const originalText = btnSpan.innerText;

            const user = userField.value.trim();
            const email = emailField.value.trim();
            const message = msgField.value.trim();

            // Boş alan kontrolü
            if (!user || !email || !message) {
                btnSpan.innerText = localStorage.getItem('ezLang') === 'tr' ? "ALANLARI DOLDURUN!" : "FILL ALL FIELDS!";
                setTimeout(() => { btnSpan.innerText = originalText; }, 2000);
                return;
            }

            // Butonu gönderiliyor durumuna al ve kilitle (spamı önlemek için)
            sendBtn.disabled = true;
            btnSpan.innerHTML = '<i class="fas fa-spinner fa-spin"></i>'; 

            const payload = {
                username: "EZWIN STUDIO CONTACT",
                avatar_url: "https://i.imgur.com/AfFp7pu.png", // İstediğin bir logo URL'si koyabilirsin
                embeds: [{
                    title: "📨 Yeni İletişim Formu Mesajı",
                    color: 3447003, // Mavi tema rengi
                    fields: [
                        { name: "👤 Kullanıcı Adı", value: user, inline: true },
                        { name: "📧 İletişim (Discord/Email)", value: email, inline: true },
                        { name: "📝 Mesaj", value: message }
                    ],
                    timestamp: new Date().toISOString()
                }]
            };

            try {
                const response = await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    // BAŞARILI: Formu temizle ve "Gönderildi" yaz
                    userField.value = '';
                    emailField.value = '';
                    msgField.value = '';

                    btnSpan.innerText = localStorage.getItem('ezLang') === 'tr' ? "GÖNDERİLDİ!" : "SENT!";
                    sendBtn.style.borderColor = "var(--status-active)";
                    sendBtn.style.color = "var(--status-active)";
                } else {
                    throw new Error('Webhook error');
                }
            } catch (error) {
                // HATA: "Gönderilemedi" yaz
                console.error("Webhook Error:", error);
                btnSpan.innerText = localStorage.getItem('ezLang') === 'tr' ? "GÖNDERİLEMEDİ!" : "FAILED!";
                sendBtn.style.borderColor = "var(--accent-pink)";
                sendBtn.style.color = "var(--accent-pink)";
            }

            // 3 Saniye sonra butonu eski haline getir
            setTimeout(() => {
                btnSpan.innerText = originalText;
                sendBtn.disabled = false;
                sendBtn.style.borderColor = "";
                sendBtn.style.color = "";
            }, 3000);
        }

        // Toggle panel vb. diğer küçük fonksiyonların varsa onları da buranın altına ekleyebilirsin.
        function togglePanel(panelId) {
            document.getElementById(panelId).classList.toggle('active');
        }
    </script>
</body>
</html>
