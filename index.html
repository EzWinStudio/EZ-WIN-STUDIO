<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EZWIN STUDIO | Official Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Inter:wght@300;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0f; 
            --accent-primary: #007cf0;
            --accent-secondary: #00dfd8;
            --accent-pink: #ff0080;
            --accent-emerald: #00ff88;
            --accent-gold: #ffcc00;
            --accent-glow: rgba(0, 124, 240, 0.4);
            --glass: rgba(255, 255, 255, 0.04);
            --panel-bg: rgba(10, 10, 18, 0.95);
            --status-active: #00ff88; 
        }

        /* Güvenlik: Metin seçmeyi engelle */
        * { -webkit-user-select: none; -ms-user-select: none; user-select: none; }
        input, textarea { -webkit-user-select: text; -ms-user-select: text; user-select: text; }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: var(--bg); color: white;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden; scroll-behavior: smooth;
        }
        body.locked { overflow: hidden; }

        #bg-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; opacity: 0.4; pointer-events: none; }

        /* --- GİRİŞ EKRANI --- */
        #enter-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg); z-index: 999999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: 1.2s cubic-bezier(0.7, 0, 0.3, 1);
        }
        #enter-overlay.fade-out { opacity: 0; visibility: hidden; transform: scale(1.1); }

        .enter-btn {
            padding: 22px 70px; border: 2px solid var(--accent-primary);
            background: transparent; color: white; font-family: 'Orbitron', sans-serif;
            font-weight: 900; font-size: 14px; letter-spacing: 8px; border-radius: 4px;
            cursor: pointer; transition: 0.5s; box-shadow: 0 0 30px var(--accent-glow);
            margin-top: 50px;
        }
        .enter-btn:hover { background: var(--accent-primary); box-shadow: 0 0 60px var(--accent-primary); }

        /* --- BİLDİRİM PANELİ --- */
        .notification-wrapper {
            position: fixed; top: -100px; left: 50%; transform: translateX(-50%);
            z-index: 10001; transition: 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .notification-wrapper.show { top: 25px; }

        .dynamic-island {
            background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1); border-bottom: 2px solid var(--accent-primary);
            border-radius: 50px; padding: 8px 12px; display: flex; align-items: center; gap: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6), 0 0 20px var(--accent-glow);
            min-width: 280px; max-width: 450px;
        }

        .status-badge {
            background: rgba(255,255,255,0.05); padding: 4px 10px; border-radius: 20px;
            display: flex; align-items: center; gap: 6px; border: 1px solid rgba(255,255,255,0.1);
        }
        .status-dot { width: 6px; height: 6px; background: var(--accent-primary); border-radius: 50%; box-shadow: 0 0 8px var(--accent-primary); animation: pulse 1.5s infinite; }
        .status-text { font-family: 'Orbitron'; font-size: 8px; font-weight: 900; color: var(--accent-primary); letter-spacing: 1px; }

        .marquee-box { flex: 1; overflow: hidden; white-space: nowrap; }
        .marquee-content { display: inline-block; font-family: 'Inter'; font-size: 11px; font-weight: 700; color: #eee; animation: marquee-move 15s linear infinite; padding-left: 100%; }

        @keyframes marquee-move { 0% { transform: translateX(0); } 100% { transform: translateX(-200%); } }
        @keyframes pulse { 0% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(1.2); } 100% { opacity: 1; transform: scale(1); } }

        /* --- WIDGETS --- */
        .lang-wrapper { position: fixed; top: 25px; right: 25px; z-index: 10003; }
        .music-widget { position: fixed; top: 90px; left: 25px; z-index: 10002; }
        .theme-wrapper { position: fixed; top: 90px; right: 25px; z-index: 10002; }
        
        .control-btn {
            width: 54px; height: 54px; background: var(--glass); border-radius: 18px;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            border: 1px solid rgba(255,255,255,0.1); transition: 0.3s;
        }
        .control-btn:hover { border-color: var(--accent-primary); box-shadow: 0 0 15px var(--accent-glow); }

        .theme-btn, .lang-btn { width: auto; padding: 0 20px; gap: 10px; font-family: 'Orbitron'; font-weight: 800; font-size: 11px; letter-spacing: 2px; }

        .panel-flyout {
            position: absolute; top: 75px; background: var(--panel-bg);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 28px; padding: 25px;
            opacity: 0; visibility: hidden; transform: translateY(-10px); transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 30px 60px rgba(0,0,0,0.9); backdrop-filter: blur(25px); right: 0;
        }
        .panel-flyout.active { opacity: 1; visibility: visible; transform: translateY(0); }

        .theme-card, .lang-option {
            padding: 12px 15px; background: rgba(255,255,255,0.03); margin-bottom: 8px;
            border-radius: 10px; cursor: pointer; font-family: 'Orbitron'; font-size: 10px; transition: 0.3s;
            display: flex; align-items: center; gap: 10px;
        }
        .theme-card:hover, .lang-option:hover { background: var(--accent-primary); }

        /* CONTACT SECTION */
        .contact-container {
            width: 100%; max-width: 700px; background: var(--glass); 
            border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 20px; 
            padding: 40px; box-sizing: border-box; backdrop-filter: blur(10px);
        }
        .contact-input {
            width: 100%; background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px; padding: 18px 20px; color: white; font-family: 'Orbitron', sans-serif;
            font-size: 12px; outline: none; transition: 0.3s; box-sizing: border-box; margin-bottom: 20px;
        }
        .contact-input:focus { border-color: var(--accent-primary); box-shadow: 0 0 15px var(--accent-glow); }
        
        .send-btn {
            width: 100%; background: transparent; border: 2px solid var(--accent-primary);
            color: white; padding: 18px; border-radius: 12px; font-family: 'Orbitron', sans-serif;
            font-weight: 900; font-size: 14px; letter-spacing: 4px; cursor: pointer;
            transition: 0.4s; display: flex; align-items: center; justify-content: center; gap: 12px;
        }
        .send-btn.success { border-color: var(--accent-emerald); color: var(--accent-emerald); }

        .animated-text { 
            font-family: 'Orbitron', sans-serif;
            background: linear-gradient(to right, var(--accent-primary), var(--accent-secondary), var(--accent-pink), var(--accent-emerald), var(--accent-gold));
            background-size: 300% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: textFlow 5s ease infinite;
        }
        @keyframes textFlow { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        .links-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; width: 90%; max-width: 850px; margin-top: 40px; }
        .btn {
            background: var(--glass); border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 25px; border-radius: 16px; color: white; text-decoration: none;
            font-family: 'Orbitron', sans-serif; font-weight: 800; font-size: 11px; transition: 0.4s;
            display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center;
        }
        .btn:hover { transform: translateY(-8px); border-color: var(--accent-primary); box-shadow: 0 10px 30px var(--accent-glow); }
        .btn i { font-size: 24px; color: var(--accent-primary); }

        .v-counter { position: fixed; bottom: 30px; left: 30px; display: flex; align-items: center; gap: 12px; }
        .copyright { position: fixed; bottom: 30px; right: 30px; font-family: 'Orbitron'; font-size: 9px; opacity: 0.3; letter-spacing: 2px; }

        @media(max-width: 768px) { .links-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body class="locked" oncontextmenu="return false;"> <canvas id="bg-canvas"></canvas>

    <div id="enter-overlay">
        <h1 class="animated-text" style="font-size: 60px;">EZWIN STUDIO</h1>
        <button class="enter-btn" onclick="startSystem()">ENTER HUB</button>
    </div>

    <div id="statusNotify" class="notification-wrapper">
        <div class="dynamic-island">
            <div class="status-badge"><div class="status-dot"></div><div class="status-text">LIVE</div></div>
            <div class="marquee-box"><div class="marquee-content">EZWIN STUDIO V4.8 ONLINE • DATA SECURED</div></div>
        </div>
    </div>

    <div class="lang-wrapper">
        <div class="control-btn lang-btn" onclick="togglePanel('langMenu')"><span id="currentLangText">EN</span></div>
        <div class="panel-flyout" id="langMenu">
            <div class="lang-option" onclick="changeLang('en')">ENGLISH</div>
            <div class="lang-option" onclick="changeLang('tr')">TÜRKÇE</div>
        </div>
    </div>

    <div class="main-content" id="main" style="opacity:0; padding-top: 100px;">
        <center>
            <h1 class="animated-text" style="font-size: 80px;">EZWIN STUDIO</h1>
            <div class="links-grid">
                <a href="#" class="btn"><i class="fab fa-discord"></i><span>DISCORD</span></a>
                <a href="#" class="btn"><i class="fab fa-youtube"></i><span>YOUTUBE</span></a>
                <a href="#" class="btn"><i class="fas fa-code"></i><span>PROJECTS</span></a>
            </div>

            <section id="contact" style="margin-top: 100px; padding-bottom: 100px;">
                <h2 class="animated-text" style="font-size: 40px;">CONTACT US</h2>
                <div class="contact-container">
                    <input type="text" id="contactUser" placeholder="USERNAME" class="contact-input">
                    <input type="text" id="contactEmail" placeholder="DISCORD / EMAIL" class="contact-input">
                    <textarea id="contactMessage" placeholder="ENTER YOUR MESSAGE..." rows="4" class="contact-input"></textarea>
                    <button id="sendBtn" class="send-btn" onclick="sendToDiscord()">
                        <i class="fas fa-paper-plane"></i> <span id="btnText">SUBMIT</span>
                    </button>
                </div>
            </center>
        </center>
    </div>

    <div class="v-counter">
        <span style="font-family:'Orbitron';">V4.8</span>
    </div>
    <div class="copyright">EZWIN STUDIO © 2026</div>

    <script>
        // 1. GÜVENLİK: Klavye Kısayollarını Engelle (F12, Ctrl+Shift+I vb.)
        document.onkeydown = function(e) {
            if(e.keyCode == 123) return false; // F12
            if(e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) return false;
            if(e.ctrlKey && e.shiftKey && e.keyCode == 'C'.charCodeAt(0)) return false;
            if(e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) return false;
            if(e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) return false;
        }

        // 2. SİSTEMİ BAŞLAT
        function startSystem() {
            document.getElementById('enter-overlay').classList.add('fade-out');
            document.body.classList.remove('locked');
            document.getElementById('main').style.opacity = "1";
            document.getElementById('statusNotify').classList.add('show');
        }

        function togglePanel(id) {
            document.querySelectorAll('.panel-flyout').forEach(p => {
                if(p.id !== id) p.classList.remove('active');
            });
            document.getElementById(id).classList.toggle('active');
        }

        // 3. DISCORD GÖNDERME VE TEMİZLEME FONKSİYONU
        async function sendToDiscord() {
            const webhookURL = "BURAYA_WEBHOOK_URL_GELECEK"; // Burayı kendi URL'nle değiştir kanka
            const user = document.getElementById('contactUser');
            const email = document.getElementById('contactEmail');
            const msg = document.getElementById('contactMessage');
            const btn = document.getElementById('sendBtn');
            const btnText = document.getElementById('btnText');

            if(!user.value || !msg.value) {
                alert("Lütfen gerekli alanları doldur!");
                return;
            }

            // Butonu yükleniyor moduna al
            btn.disabled = true;
            btnText.innerText = "SENDING...";

            const payload = {
                embeds: [{
                    title: "🚀 New Website Message",
                    color: 0x007cf0,
                    fields: [
                        { name: "👤 User", value: user.value, inline: true },
                        { name: "📧 Contact", value: email.value || "Not provided", inline: true },
                        { name: "💬 Message", value: msg.value }
                    ],
                    footer: { text: "EZWIN Security System" },
                    timestamp: new Date()
                }]
            };

            try {
                await fetch(webhookURL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                // BAŞARILI: Kutuları temizle ve butonu güncelle
                user.value = "";
                email.value = "";
                msg.value = "";
                
                btn.classList.add('success');
                btnText.innerText = "MESSAGE SENT! ✓";

                // 3 saniye sonra butonu eski haline döndür
                setTimeout(() => {
                    btn.disabled = false;
                    btn.classList.remove('success');
                    btnText.innerText = "SUBMIT";
                }, 3000);

            } catch (err) {
                alert("Hata oluştu!");
                btn.disabled = false;
                btnText.innerText = "SUBMIT";
            }
        }

        // Arka plan animasyonu (Basit yıldızlar)
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        let stars = [];
        for(let i=0; i<100; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2,
                speed: Math.random() * 0.5
            });
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#fff";
            stars.forEach(s => {
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI*2);
                ctx.fill();
                s.y -= s.speed;
                if(s.y < 0) s.y = canvas.height;
            });
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
