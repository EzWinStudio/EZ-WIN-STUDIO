<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EZWIN STUDIO | Premium Official</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Inter:wght@300;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #030305;
            --accent-primary: #007cf0;
            --accent-secondary: #00dfd8;
            --accent-pink: #ff0080;
            --accent-emerald: #00ff88;
            --accent-glow: rgba(0, 124, 240, 0.4);
            --glass: rgba(255, 255, 255, 0.03);
            --panel-bg: rgba(5, 5, 10, 0.98);
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: var(--bg); color: white;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden; scroll-behavior: smooth;
        }
        body.locked { overflow: hidden; }

        #bg-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; opacity: 0.15; pointer-events: none; }

        /* --- GİRİŞ EKRANI --- */
        #enter-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg); z-index: 999999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: 1.2s cubic-bezier(0.7, 0, 0.3, 1);
        }
        #enter-overlay.fade-out { opacity: 0; visibility: hidden; transform: scale(1.1); }

        .enter-btn {
            padding: 22px 70px; border: 2px solid var(--accent-primary);
            background: transparent; color: white; font-family: 'Orbitron', sans-serif;
            font-weight: 900; font-size: 14px; letter-spacing: 8px; border-radius: 4px;
            cursor: pointer; transition: 0.5s; box-shadow: 0 0 30px var(--accent-glow);
            margin-top: 50px;
        }
        .enter-btn:hover { background: var(--accent-primary); box-shadow: 0 0 60px var(--accent-primary); }

        /* --- iPHONE BİLDİRİM --- */
        .notification-wrapper {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            z-index: 10001; width: fit-content; min-width: 320px;
        }
        .ios-notification {
            background: rgba(10, 10, 15, 0.9); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px; padding: 12px 30px; display: flex; align-items: center; gap: 15px;
            backdrop-filter: blur(20px); box-shadow: 0 15px 45px rgba(0,0,0,0.7);
        }
        .ios-icon { width: 10px; height: 10px; background: var(--accent-emerald); border-radius: 50%; box-shadow: 0 0 12px var(--accent-emerald); }
        .ios-marquee { font-size: 11px; font-weight: 800; color: #fff; text-transform: uppercase; letter-spacing: 1.5px; white-space: nowrap; animation: marquee 18s linear infinite; }
        @keyframes marquee { 0% { transform: translateX(50%); } 100% { transform: translateX(-150%); } }

        /* --- WIDGETS --- */
        .music-widget { position: fixed; top: 90px; left: 25px; z-index: 10002; }
        .theme-wrapper { position: fixed; top: 90px; right: 25px; z-index: 10002; }
        .control-btn {
            width: 50px; height: 50px; background: var(--glass); border-radius: 14px;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            border: 1px solid rgba(255,255,255,0.1); transition: 0.3s;
        }
        .panel-flyout {
            position: absolute; top: 65px; background: var(--panel-bg);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 20px;
            opacity: 0; visibility: hidden; transform: translateY(-15px); transition: 0.4s;
            box-shadow: 0 25px 50px rgba(0,0,0,0.8);
        }
        .panel-flyout.active { opacity: 1; visibility: visible; transform: translateY(0); }

        /* --- THEME MENU --- */
        #themeMenu { right: 0; width: 180px; }
        .theme-option { padding: 12px; cursor: pointer; font-family: 'Orbitron'; font-size: 10px; transition: 0.3s; }
        .theme-option:hover { background: rgba(255,255,255,0.05); }

        /* --- MAIN UI --- */
        .ui-element { opacity: 0; pointer-events: none; transition: 1s ease; }
        .ui-element.show { opacity: 1; pointer-events: all; }
        .animated-text { 
            font-family: 'Orbitron', sans-serif;
            background: linear-gradient(to right, var(--accent-primary), var(--accent-secondary), var(--accent-pink), var(--accent-emerald));
            background-size: 300% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: textFlow 5s ease infinite;
        }
        @keyframes textFlow { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        .links-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; width: 90%; max-width: 850px; margin-top: 40px; }
        .btn {
            background: var(--glass); border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 25px; border-radius: 12px; color: white; text-decoration: none;
            font-family: 'Orbitron', sans-serif; font-weight: 800; font-size: 11px; transition: 0.4s;
            display: flex; flex-direction: column; align-items: center; gap: 12px;
        }
        .btn:hover { transform: translateY(-8px); border-color: var(--accent-primary); box-shadow: 0 10px 30px var(--accent-glow); }
        .btn i { font-size: 22px; color: var(--accent-primary); }

        /* --- ÖZEL BUTON: JOIN THE ECOSYSTEM --- */
        .btn-wide {
            grid-column: span 3;
            margin-top: 10px;
            border: 1px solid var(--accent-primary);
            background: linear-gradient(90deg, rgba(0, 124, 240, 0.1), transparent);
            text-transform: uppercase;
            letter-spacing: 4px;
        }
        .btn-wide:hover { background: var(--accent-primary); color: #fff; }

        .scroll-down { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); cursor: pointer; transition: 0.5s; }
        .scroll-down.hide { opacity: 0; pointer-events: none; }
        .scroll-down i { font-size: 24px; color: var(--accent-primary); animation: bounce 2s infinite; }
        @keyframes bounce { 0%, 20%, 50%, 80%, 100% { transform: translateY(0); } 40% { transform: translateY(-10px); } }

        /* --- VOLUME HUD --- */
        #volume-hud {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.5);
            background: rgba(0, 0, 0, 0.85); border: 1px solid var(--accent-primary);
            padding: 20px 40px; border-radius: 20px; z-index: 1000000;
            display: flex; flex-direction: column; align-items: center; gap: 10px;
            opacity: 0; pointer-events: none; transition: 0.3s; backdrop-filter: blur(15px);
        }
        #volume-hud.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    </style>
</head>
<body class="locked">

    <canvas id="bg-canvas"></canvas>

    <div id="enter-overlay">
        <h1 class="animated-text" style="font-size: clamp(40px, 8vw, 70px); margin: 0;">EZWIN STUDIO</h1>
        <button class="enter-btn" onclick="startSystem()">ENTER HUB</button>
    </div>

    <div id="volume-hud">
        <i class="fas fa-volume-up" style="font-size: 30px; color: white;"></i>
        <span id="hudVal" style="font-family:'Orbitron'; font-weight:900; color:var(--accent-primary);">50%</span>
    </div>

    <div class="notification-wrapper ui-element">
        <div class="ios-notification">
            <div class="ios-icon"></div>
            <div style="overflow: hidden; width: 100%;"><div class="ios-marquee">V4.2 Status: All Systems Fixed • Join the Ecosystem Active • Premium UI • Welcome back Ezwin</div></div>
        </div>
    </div>

    <div class="music-widget ui-element">
        <div class="control-btn" onclick="togglePanel('musicPanel')"><i class="fas fa-compact-disc fa-spin"></i></div>
        <div class="panel-flyout" id="musicPanel" style="left: 0; width: 280px;">
            <div style="font-family:'Orbitron'; font-size:9px; color:var(--accent-primary); margin-bottom:15px;" id="trackName">LOADING...</div>
            <div style="display:flex; justify-content: space-evenly; align-items:center; margin-bottom:20px;">
                <i class="fas fa-backward" onclick="prevTrack()" style="cursor:pointer;"></i>
                <div style="width:45px; height:45px; background:var(--accent-primary); border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer;" onclick="togglePlay()"><i class="fas fa-play" id="playIcon"></i></div>
                <i class="fas fa-forward" onclick="nextTrack()" style="cursor:pointer;"></i>
            </div>
            <input type="range" id="volRange" min="0" max="100" value="50" style="width:100%; accent-color: var(--accent-primary);">
        </div>
    </div>

    <div class="theme-wrapper ui-element">
        <div class="control-btn" onclick="togglePanel('themeMenu')"><i class="fas fa-palette"></i></div>
        <div class="panel-flyout" id="themeMenu">
            <div class="theme-option" onclick="changeTheme('blue')">NEON BLUE</div>
            <div class="theme-option" onclick="changeTheme('cyber')">CYBER PINK</div>
            <div class="theme-option" onclick="changeTheme('emerald')">EMERALD</div>
        </div>
    </div>

    <div class="main-content" id="main" style="opacity:0">
        <section style="min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; position: relative;">
            <h1 class="animated-text" style="font-size: clamp(50px, 10vw, 90px); margin:0;">EZWIN STUDIO</h1>
            <p style="font-family:'Orbitron'; letter-spacing:8px; color:var(--accent-secondary); font-size:11px;">CORE DEVELOPMENT</p>
            
            <div class="links-grid">
                <a href="#" class="btn"><i class="fas fa-music"></i><span>MUSIC</span></a>
                <a href="#" class="btn"><i class="fab fa-youtube"></i><span>YOUTUBE</span></a>
                <a href="#" class="btn"><i class="fas fa-code"></i><span>SCRIPTS</span></a>
                <a href="#" class="btn"><i class="fas fa-shield-alt"></i><span>SERVICES</span></a>
                <a href="#" class="btn"><i class="fas fa-layer-group"></i><span>CHANNELS</span></a>
                <a href="#" class="btn"><i class="fas fa-terminal"></i><span>DATABASE</span></a>
                
                <a href="javascript:void(0)" onclick="scrollToTarget('projects')" class="btn btn-wide">
                    <i class="fas fa-project-diagram"></i>
                    <span>Join the Ecosystem</span>
                </a>
            </div>

            <div class="scroll-down" id="scrollIcon" onclick="scrollToTarget('projects')"><i class="fas fa-chevron-down"></i></div>
        </section>

        <section id="projects" style="min-height:100vh; padding: 100px 20px; display:flex; flex-direction:column; align-items:center;">
            <h2 class="animated-text" style="font-size: 3rem;">PROJECTS</h2>
            <div style="width:100%; max-width:1000px; height:300px; background:var(--glass); border-radius:20px; border:1px solid rgba(255,255,255,0.05); margin-top:30px;"></div>
        </section>
    </div>

    <div id="yt-player" style="display:none"></div>
    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        let player, isPlaying = false, pColor = "#007cf0", currentTrack = 0;
        const playlist = ['_9bw_VtMUGA', 'jfKfPfyJRdk', 'L_jWHffIx5E'];

        function startSystem() {
            document.getElementById('enter-overlay').classList.add('fade-out');
            document.body.classList.remove('locked');
            setTimeout(() => {
                document.getElementById('main').style.opacity = "1";
                document.querySelectorAll('.ui-element').forEach(el => el.classList.add('show'));
                if(player) { player.playVideo(); isPlaying = true; document.getElementById('playIcon').className = "fas fa-pause"; }
            }, 600);
        }

        function scrollToTarget(id) { document.getElementById(id).scrollIntoView({ behavior: 'smooth' }); }

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('yt-player', {
                height: '0', width: '0', videoId: playlist[currentTrack],
                playerVars: { 'autoplay': 0, 'controls': 0 },
                events: { 'onStateChange': (e) => { if(e.data == YT.PlayerState.PLAYING) document.getElementById('trackName').innerText = player.getVideoData().title; } }
            });
        }

        function togglePlay() {
            if(isPlaying) { player.pauseVideo(); document.getElementById('playIcon').className = "fas fa-play"; }
            else { player.playVideo(); document.getElementById('playIcon').className = "fas fa-pause"; }
            isPlaying = !isPlaying;
        }

        function nextTrack() { currentTrack = (currentTrack + 1) % playlist.length; player.loadVideoById(playlist[currentTrack]); }
        function prevTrack() { currentTrack = (currentTrack - 1 + playlist.length) % playlist.length; player.loadVideoById(playlist[currentTrack]); }

        let hudTimer;
        document.getElementById('volRange').oninput = (e) => {
            let v = e.target.value; player.setVolume(v);
            const hud = document.getElementById('volume-hud');
            document.getElementById('hudVal').innerText = v + "%";
            hud.classList.add('show');
            clearTimeout(hudTimer);
            hudTimer = setTimeout(() => hud.classList.remove('show'), 1000);
        };

        function togglePanel(id) {
            const p = document.getElementById(id);
            const wasActive = p.classList.contains('active');
            document.querySelectorAll('.panel-flyout').forEach(el => el.classList.remove('active'));
            if(!wasActive) p.classList.add('active');
        }

        function changeTheme(tk) {
            const t = { blue: {p:'#007cf0', s:'#00dfd8'}, cyber: {p:'#ff0080', s:'#7928ca'}, emerald: {p:'#00ff88', s:'#00a1ff'} }[tk];
            document.documentElement.style.setProperty('--accent-primary', t.p);
            document.documentElement.style.setProperty('--accent-secondary', t.s);
            pColor = t.p;
            document.getElementById('themeMenu').classList.remove('active');
        }

        window.onscroll = () => {
            const icon = document.getElementById('scrollIcon');
            if(window.scrollY > 100) icon.classList.add('hide');
            else icon.classList.remove('hide');
        };

        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        function res() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.onresize = res; res();
        class P {
            constructor() { this.init(); }
            init() { this.x = Math.random()*canvas.width; this.y = canvas.height+10; this.s = Math.random()*1.5+0.5; this.o = Math.random()*0.15; }
            draw() { ctx.globalAlpha = this.o; ctx.fillStyle = pColor; ctx.font = "10px Orbitron"; ctx.fillText("EZWIN", this.x, this.y); this.y -= this.s; if(this.y < -20) this.init(); }
        }
        const pts = Array.from({length: 40}, () => new P());
        function anim() { ctx.clearRect(0,0,canvas.width,canvas.height); pts.forEach(p => p.draw()); requestAnimationFrame(anim); }
        anim();
    </script>
</body>
</html>
