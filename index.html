<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EZWIN STUDIO | Premium Official</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg: #030305;
            --accent-primary: #007cf0;
            --accent-secondary: #00dfd8;
            --accent-pink: #ff0080;
            --accent-glow: rgba(0, 124, 240, 0.4);
            --glass: rgba(255, 255, 255, 0.03);
            --panel-bg: rgba(5, 5, 10, 0.98);
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: var(--bg); color: white;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden; scroll-behavior: smooth;
        }
        body.locked { overflow: hidden; }

        #bg-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; opacity: 0.2; pointer-events: none; }

        /* --- GİRİŞ EKRANI --- */
        #enter-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg); z-index: 999999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: 1s cubic-bezier(0.4, 0, 0.2, 1);
        }
        #enter-overlay.fade-out { opacity: 0; visibility: hidden; transform: scale(1.1); }

        .enter-btn {
            padding: 20px 60px; border: 2px solid var(--accent-primary);
            background: transparent; color: white; font-weight: 900;
            font-size: 16px; letter-spacing: 5px; border-radius: 50px;
            cursor: pointer; transition: 0.4s; box-shadow: 0 0 25px var(--accent-glow);
        }
        .enter-btn:hover { background: var(--accent-primary); box-shadow: 0 0 50px var(--accent-primary); }

        /* --- UI ELEMENTS --- */
        .ui-element { opacity: 0; pointer-events: none; transition: 0.8s ease; z-index: 10000; }
        .ui-element.show { opacity: 1; pointer-events: all; }

        /* --- DUYURU SİSTEMİ (EN YUKARI ALINDI) --- */
        .announcement-bar {
            position: fixed; top: 6px; left: 50%; transform: translateX(-50%);
            width: 400px; background: var(--glass); border: 1px solid var(--accent-glow);
            border-radius: 30px; padding: 6px 20px; backdrop-filter: blur(15px); overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .marquee-text { display: inline-block; white-space: nowrap; animation: marquee 15s linear infinite; font-size: 10px; font-weight: 800; color: var(--accent-secondary); letter-spacing: 1px; }
        @keyframes marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }

        /* --- MÜZİK PLAYER (GELİŞTİRİLDİ) --- */
        .music-widget { position: fixed; top: 25px; left: 25px; }
        .music-panel { 
            position: absolute; top: 65px; left: 0; width: 280px; 
            background: var(--panel-bg); border: 1px solid rgba(255,255,255,0.1); 
            border-radius: 20px; padding: 20px; 
            opacity: 0; visibility: hidden; transform: translateY(-15px) scale(0.95); transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 15px 50px rgba(0,0,0,0.9);
        }
        .music-panel.active { opacity: 1; visibility: visible; transform: translateY(0) scale(1); }
        
        .track-info { font-size: 11px; font-weight: 900; color: var(--accent-primary); overflow: hidden; white-space: nowrap; margin-bottom: 15px; position: relative; }
        .track-name { display: inline-block; animation: trackMove 10s linear infinite; padding-left: 100%; }
        @keyframes trackMove { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }

        .vol-display { font-size: 10px; font-weight: 900; color: var(--accent-secondary); margin-left: auto; background: rgba(0,0,0,0.3); padding: 2px 8px; border-radius: 10px; transition: 0.3s; }

        /* --- LOGO & SAYAÇ --- */
        .v-counter {
            position: fixed; bottom: 25px; left: 25px; 
            display: flex; align-items: center; gap: 12px;
            background: var(--glass); padding: 6px 15px 6px 6px; border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(10px);
        }
        .logo-box { width: 32px; height: 32px; background: var(--accent-primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 15px var(--accent-glow); }

        /* --- LİNKLER --- */
        .links-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; width: 90%; max-width: 850px; margin-top: 40px; }
        .btn {
            background: var(--glass); border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 22px; border-radius: 15px; color: white; text-decoration: none;
            font-weight: 800; font-size: 12px; transition: 0.4s; backdrop-filter: blur(10px);
            display: flex; flex-direction: column; align-items: center; gap: 10px;
        }
        .btn:hover { transform: translateY(-5px); border-color: var(--accent-primary); box-shadow: 0 10px 30px var(--accent-glow); }
        .btn i { font-size: 20px; color: var(--accent-primary); }

        /* --- TEMA --- */
        .theme-wrapper { position: fixed; top: 25px; right: 25px; }
        .theme-menu {
            position: absolute; top: 65px; right: 0; background: var(--panel-bg);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 15px;
            padding: 10px; width: 150px; display: flex; flex-direction: column; gap: 5px;
            opacity: 0; visibility: hidden; transform: translateY(-15px); transition: 0.4s;
        }
        .theme-menu.active { opacity: 1; visibility: visible; transform: translateY(0); }

        .copyright { position: fixed; bottom: 25px; right: 25px; font-size: 9px; opacity: 0.4; font-weight: 900; letter-spacing: 2px; }
    </style>
</head>
<body class="locked">

    <canvas id="bg-canvas"></canvas>

    <div id="enter-overlay">
        <h1 style="font-size: 60px; margin: 0; font-weight: 900; background: linear-gradient(to right, #007cf0, #00dfd8); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">EZWIN STUDIO</h1>
        <button class="enter-btn" style="margin-top: 30px;" onclick="startSystem()">SİSTEME GİRİŞ YAP</button>
    </div>

    <div class="announcement-bar ui-element">
        <div class="marquee-text">V3.0 PREMIUM AKTİF • TÜM HATALAR GİDERİLDİ • EZWIN STUDIO HOŞ GELDİNİZ</div>
    </div>

    <div class="music-widget ui-element">
        <div style="width:50px; height:50px; background:var(--glass); border-radius:12px; display:flex; align-items:center; justify-content:center; cursor:pointer; border:1px solid rgba(255,255,255,0.1);" onclick="togglePanel('musicPanel')">
            <i class="fas fa-music"></i>
        </div>
        <div class="music-panel" id="musicPanel">
            <div class="track-info">
                <span class="track-name" id="trackName">YÜKLENİYOR...</span>
            </div>
            <div style="display:flex; justify-content: space-around; align-items: center; margin-bottom: 20px;">
                <i class="fas fa-backward-step" onclick="player.previousVideo()" style="cursor:pointer"></i>
                <div style="width:45px; height:45px; border:2px solid var(--accent-primary); border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer;" onclick="togglePlay()">
                    <i class="fas fa-play" id="playIcon"></i>
                </div>
                <i class="fas fa-forward-step" onclick="player.nextVideo()" style="cursor:pointer"></i>
            </div>
            <div style="display:flex; align-items:center; gap:10px;">
                <i class="fas fa-volume-low" style="font-size:12px;"></i>
                <input type="range" id="volRange" min="0" max="100" value="50" style="flex:1; accent-color: var(--accent-primary);">
                <span class="vol-display" id="volPercent">50%</span>
            </div>
        </div>
    </div>

    <div class="theme-wrapper ui-element">
        <div style="width:50px; height:50px; background:var(--glass); border-radius:12px; display:flex; align-items:center; justify-content:center; cursor:pointer; border:1px solid rgba(255,255,255,0.1);" onclick="togglePanel('themeMenu')">
            <i class="fas fa-paint-brush"></i>
        </div>
        <div class="theme-menu" id="themeMenu">
            <div style="padding:10px; cursor:pointer; font-size:11px; font-weight:800;" onclick="changeTheme('blue')">BLUE NEON</div>
            <div style="padding:10px; cursor:pointer; font-size:11px; font-weight:800;" onclick="changeTheme('cyber')">CYBERPINK</div>
        </div>
    </div>

    <div class="v-counter ui-element">
        <div class="logo-box"><i class="fas fa-bolt" style="font-size:14px;"></i></div>
        <span style="font-size:13px; font-weight:900; color:var(--accent-secondary);" id="vCount">0</span>
    </div>

    <div class="main-content" id="main">
        <section style="min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;">
            <h1 style="font-size: 5rem; margin:0; font-weight:900; letter-spacing:-3px;">EZWIN STUDIO</h1>
            <p style="letter-spacing:10px; color:var(--accent-secondary); font-size:12px;">BY EZWIN YASEN</p>
            
            <div class="links-grid">
                <a href="#" class="btn"><i class="fas fa-music"></i><span>JOIN MUSIC</span></a>
                <a href="#" class="btn"><i class="fab fa-youtube"></i><span>YOUTUBE</span></a>
                <a href="#" class="btn"><i class="fas fa-unlock-alt"></i><span>UNCOPYLOCKED</span></a>
                <a href="#" class="btn"><i class="fas fa-user-shield"></i><span>SERVICES</span></a>
                <a href="#" class="btn"><i class="fas fa-compact-disc"></i><span>CHANNELS</span></a>
                <a href="#" class="btn"><i class="fas fa-ghost"></i><span>CHEATS</span></a>
                <a href="#" class="btn" style="grid-column: span 3; border-color:var(--accent-primary);">ENTER ECOSYSTEM</a>
            </div>
        </section>
    </div>

    <div class="copyright ui-element">EZWIN STUDIO © 2026</div>
    <div id="yt-player" style="display:none"></div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        let player, isPlaying = false, pColor = "#007cf0";

        function startSystem() {
            document.getElementById('enter-overlay').classList.add('fade-out');
            document.body.classList.remove('locked');
            setTimeout(() => {
                document.getElementById('main').classList.add('visible');
                document.querySelectorAll('.ui-element').forEach(el => el.classList.add('show'));
                if(player) { player.playVideo(); isPlaying = true; document.getElementById('playIcon').className = "fas fa-pause"; }
            }, 600);
            let c = parseInt(localStorage.getItem('vCount') || 1540);
            localStorage.setItem('vCount', ++c);
            document.getElementById('vCount').innerText = c.toLocaleString();
        }

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('yt-player', {
                height: '0', width: '0', videoId: '_9bw_VtMUGA',
                playerVars: { 'autoplay': 0, 'controls': 0 },
                events: { 
                    'onReady': (e) => e.target.setVolume(50),
                    'onStateChange': (e) => {
                        if(e.data == YT.PlayerState.PLAYING) {
                            document.getElementById('trackName').innerText = player.getVideoData().title;
                        }
                    }
                }
            });
        }

        function togglePlay() {
            if(isPlaying) { player.pauseVideo(); document.getElementById('playIcon').className = "fas fa-play"; }
            else { player.playVideo(); document.getElementById('playIcon').className = "fas fa-pause"; }
            isPlaying = !isPlaying;
        }

        document.getElementById('volRange').oninput = (e) => {
            let v = e.target.value;
            player.setVolume(v);
            document.getElementById('volPercent').innerText = v + "%";
            document.getElementById('volPercent').style.color = "var(--accent-primary)";
            setTimeout(() => document.getElementById('volPercent').style.color = "", 300);
        };

        function togglePanel(id) {
            const p = document.getElementById(id);
            const active = p.classList.contains('active');
            document.querySelectorAll('.music-panel, .theme-menu').forEach(el => el.classList.remove('active'));
            if(!active) p.classList.add('active');
        }

        function changeTheme(t) {
            const c = t === 'blue' ? {p:'#007cf0', s:'#00dfd8'} : {p:'#ff0080', s:'#7928ca'};
            document.documentElement.style.setProperty('--accent-primary', c.p);
            document.documentElement.style.setProperty('--accent-secondary', c.s);
            pColor = c.p;
            document.getElementById('themeMenu').classList.remove('active');
        }

        // Background
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        function res() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.onresize = res; res();
        class P {
            constructor() { this.init(); }
            init() { this.x = Math.random()*canvas.width; this.y = canvas.height+10; this.s = Math.random()*2+0.5; this.o = Math.random()*0.3; }
            draw() { ctx.globalAlpha = this.o; ctx.fillStyle = pColor; ctx.fillText("EZWIN", this.x, this.y); this.y -= this.s; if(this.y < -20) this.init(); }
        }
        const pts = Array.from({length: 35}, () => new P());
        function anim() { ctx.clearRect(0,0,canvas.width,canvas.height); pts.forEach(p => p.draw()); requestAnimationFrame(anim); }
        anim();
    </script>
</body>
</html>
